name: Reconcile Desk plugin
on:
  push:
    paths: ['chatgpt-plugin/**', '.github/workflows/reconcile-plugin.yml']
  pull_request:
    paths: ['chatgpt-plugin/**', '.github/workflows/reconcile-plugin.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt
      - run: pytest -q
      - run: python verify_mcp.py
