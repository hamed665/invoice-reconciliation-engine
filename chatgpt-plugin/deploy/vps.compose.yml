name: reconcile-desk
services:
  app:
    image: reconcile-desk:460cde6
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      DEMO_ONLY: 'true'
      PUBLIC_HOST: reconcile.smartvisionsai.com
    networks:
      isolated:
        aliases:
          - reconcile-desk
    cpus: '0.25'
    mem_limit: 192m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  isolated:
    name: reconcile-desk-isolated
    internal: true
